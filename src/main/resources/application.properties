server.port=8083
spring.application.name=appointment-resilience-service

# Cấu hình kết nối PostgreSQL (thay đổi thông tin kết nối phù hợp với máy của bạn)
spring.datasource.url=jdbc:postgresql://localhost:5432/healthcare_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 1. Cấu hình RateLimiter: tối đa 5 request trong 10 giây
resilience4j.ratelimiter.instances.appointmentFullResilience.limit-for-period=5
resilience4j.ratelimiter.instances.appointmentFullResilience.limit-refresh-period=10s
resilience4j.ratelimiter.instances.appointmentFullResilience.timeout-duration=0

# 2. Cấu hình Circuit Breaker
resilience4j.circuitbreaker.instances.appointmentFullResilience.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.appointmentFullResilience.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.appointmentFullResilience.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.appointmentFullResilience.permitted-number-of-calls-in-half-open-state=3

# 3. Cấu hình Retry
resilience4j.retry.instances.appointmentFullResilience.max-attempts=3
resilience4j.retry.instances.appointmentFullResilience.wait-duration=2s
resilience4j.retry.instances.appointmentFullResilience.retry-exceptions=org.springframework.web.client.RestClientException

# Log chi tiết của Resilience4j
logging.level.io.github.resilience4j=DEBUG